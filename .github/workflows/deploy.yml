name: Deploy ThermoScan API

on:
  push:
    branches: [main, dev]

# One deploy at a time; a new push waits for the running one to finish.
concurrency:
  group: deploy-thermoscan
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    env:
      APP_NAME: thermoscan-api
      HOST: api-thermoscan.realan.space
      DEVICE_PING_INTERVAL_SECONDS: "5"
    steps:
      - uses: actions/checkout@v4

      - name: Build and Start Containers
        run: |
          docker compose up -d --build --remove-orphans
          docker exec -i thermoscan-db psql -U ${POSTGRES_USER:-thermoscan} -d ${POSTGRES_DB:-thermoscan} < ./software/backend/db/clean.sql

      - name: Remove old images
        run: |
          docker image prune -f --filter dangling=true
