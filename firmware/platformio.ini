; PlatformIO Project Configuration File for ThermoScan Firmware
; Multi-environment setup: ESP32 production target & Native unit testing target

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = pre:build_dirs.py
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder, direct
build_src_filter = +<*> -<MLX90640/> -<NEMA17/> -<pin_scanner/>
lib_deps =
    adafruit/Adafruit MLX90640 @ ^1.1.1
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/Adafruit INA219 @ ^1.2.3
    bblanchon/ArduinoJson @ ^7.2.0
    madhephaestus/ESP32Servo @ ^3.0.5
build_flags = -std=gnu++17 -fno-exceptions -fno-rtti

[env:native]
platform = native
test_framework = unity
test_build_src = true
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
build_src_filter = +<*> -<MLX90640/> -<NEMA17/> -<pin_scanner/> -<hal_esp32/> +<hal_esp32/http_cloud_client.cpp> -<main.cpp>
build_flags = -std=c++17 -DUNIT_TEST

[env:pin_scanner]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
build_src_filter = +<pin_scanner/>
build_flags = -std=gnu++17
