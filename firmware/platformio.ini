; PlatformIO Project Configuration File for ThermoScan Firmware
; Multi-environment setup: ESP32 production target & Native unit testing target

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = pre:build_dirs.py
; 1.9 MB app slots (default 1.25 MB is too small for Arduino-ESP32 3.x + WiFi/TLS). NVS offset unchanged.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
monitor_filters = esp32_exception_decoder, direct
build_src_filter = +<*> -<lab/>
lib_deps =
    adafruit/Adafruit MLX90640 @ ^1.1.1
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/Adafruit INA228 Library @ ^1.0.1
    bblanchon/ArduinoJson @ ^7.2.0
    madhephaestus/ESP32Servo @ ^3.0.5
build_flags = -std=gnu++17 -fno-exceptions -fno-rtti

[env:esp32dev_demo]
extends = env:esp32dev
; Adjust WIFI_SSID, WIFI_PASSWORD and BACKEND_URL to match your local router & laptop IP
build_flags =
    ${env:esp32dev.build_flags}
    -DPOST_CLEANING_WAIT_SECONDS=20
    -DDEMO_BYPASS_SOLAR_WINDOW=1
    ; -DWIFI_SSID=\"SeuRoteador\"
    ; -DWIFI_PASSWORD=\"SuaSenha\"
    ; -DBACKEND_URL=\"http://192.168.0.100:8080\"

[env:native]
platform = native
test_framework = unity
test_build_src = true
lib_deps =
    bblanchon/ArduinoJson @ ^7.2.0
build_src_filter = +<*> -<lab/> -<hal_esp32/> +<hal_esp32/http_cloud_client.cpp> +<hal_esp32/http_cloud_client_json.cpp> -<main.cpp>
build_flags = -std=c++17 -DUNIT_TEST

[env:pin_scanner]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
lib_deps =
    madhephaestus/ESP32Servo @ ^3.0.5
build_src_filter = +<lab/pin_scanner/>
build_flags = -std=gnu++17
